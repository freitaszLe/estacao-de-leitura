{% load static %}

<header class="header_section">
  <div class="container">
    <nav class="navbar navbar-expand-lg custom_nav-container">
      <a class="navbar-brand" href="{% url 'livros:home' %}">
        <span>Estação Literária</span>
      </a>

      <button class="navbar-toggler" type="button" data-toggle="collapse"
        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class=""> </span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'livros:comprar' %}">Comprar</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'livros:alugar' %}">Alugar</a></li>
        </ul>

        <div class="user_option">

          {% if user.is_authenticated %}
           <a href="{% url 'usuarios:estante' %}" class="btn btn-outline-light btn-sm mr-2">Minha Estante</a>
            <a href="{% url 'usuarios:logout' %}" class="btn btn-secondary btn-sm">Sair</a>
          {% else %}
            <a href="{% url 'usuarios:login' %}" class="btn btn-outline-light btn-sm mr-2">Entrar</a>
            <a href="{% url 'usuarios:cadastro' %}" class="btn btn-light btn-sm">Cadastre-se</a>
          {% endif %}
          
          <a class="cart_link ml-3" href="{% url 'livros:ver_carrinho' %}">
            <i class="fa fa-shopping-cart"></i>
          </a>



        </div>
      </div>
    </nav>
  </div>
</header>
