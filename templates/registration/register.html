{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Cadastre-se</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Cadastrar</button>
    </form>
</div>
{% endblock %}
